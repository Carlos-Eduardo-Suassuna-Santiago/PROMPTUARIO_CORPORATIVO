services:
  # Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬ DATABASES Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬
  db-iam:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: iam
      POSTGRES_PASSWORD: ${DB_IAM_PASSWORD:-iam_pass}
      POSTGRES_DB: iam_db
    volumes:
      - iam_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U iam -d iam_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [ backend ]

  db-patient-clinical:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinical
      POSTGRES_PASSWORD: ${DB_CLINICAL_PASSWORD:-clinical_pass}
      POSTGRES_DB: patient_clinical_db
    volumes:
      - patient_clinical_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U clinical -d patient_clinical_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [ backend ]

  db-reporting:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reporting
      POSTGRES_PASSWORD: ${DB_REPORTING_PASSWORD:-reporting_pass}
      POSTGRES_DB: reporting_db
    volumes:
      - reporting_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U reporting -d reporting_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [ backend ]

  db-ai:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ai
      MONGO_INITDB_ROOT_PASSWORD: ${DB_AI_PASSWORD:-ai_pass}
      MONGO_INITDB_DATABASE: ai_db
    volumes:
      - ai_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ backend ]

  # Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬ INFRASTRUCTURE Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [ backend ]
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: promptuario
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-promptuario_pass}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ backend ]
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    # Docker Hub deixou de publicar a imagem comunitária minio/minio.
    # Este mirror mantém o binário upstream versionado e evita a tag flutuante latest.
    image: dappros/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: promptuario
      MINIO_ROOT_PASSWORD: promptuario_pass
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ backend ]
    ports:
      - "9000:9000"
      - "9001:9001"

  # Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬ MICROSERVICES Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬
  iam-service:
    build:
      context: ../backend-java/iam-service
      dockerfile: Dockerfile
    container_name: iam-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-iam:5432/iam_db
      SPRING_DATASOURCE_USERNAME: iam
      SPRING_DATASOURCE_PASSWORD: ${DB_IAM_PASSWORD:-iam_pass}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: promptuario
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-promptuario_pass}
      APP_SECURITY_JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-change-in-production-32chars}
    depends_on:
      db-iam:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8001:8000"
    networks: [ backend ]
  # The prescription PDF worker is an internal Spring AMQP @RabbitListener.
  # Do not add a separate patient-clinical worker container.
  patient-clinical-service:
    build:
      context: ../backend-java/patient-clinical-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-patient-clinical:5432/patient_clinical_db
      SPRING_DATASOURCE_USERNAME: clinical
      SPRING_DATASOURCE_PASSWORD: ${DB_CLINICAL_PASSWORD:-clinical_pass}
      SPRING_RABBITMQ_HOST: rabbitmq
      APP_STORAGE_S3_ENDPOINT: http://minio:9000
      APP_STORAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      APP_STORAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      APP_SECURITY_JWT_SECRET: ${JWT_SECRET_KEY:-super-secret-change-in-production-32chars}
      SERVER_PORT: 8000
      SERVICE_NAME: patient-clinical-service
      LOG_LEVEL: INFO
    depends_on:
      db-patient-clinical:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8002:8000"
    networks: [ backend ]

  ai-service:
    build:
      context: ../backend-java
      dockerfile: ai-service/Dockerfile
    restart: unless-stopped
    environment:
      MONGODB_URL: mongodb://ai:${DB_AI_PASSWORD:-ai_pass}@db-ai:27017/ai_db?authSource=admin
      RABBITMQ_URL: amqp://promptuario:${RABBITMQ_PASSWORD:-promptuario_pass}@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/2
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-change-in-production-32chars}
      JWT_ALGORITHM: HS256
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_JSON_MODE: ${LLM_JSON_MODE:-True}
      SERVICE_NAME: ai-service
      LOG_LEVEL: INFO
    depends_on:
      db-ai:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [ backend ]
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  reporting-service:
    build:
      context: ../backend-java
      dockerfile: reporting-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: 8000
      DB_REPORTING_HOST: db-reporting
      DB_REPORTING_NAME: reporting_db
      DB_REPORTING_USER: reporting
      DB_REPORTING_PASSWORD: ${DB_REPORTING_PASSWORD:-reporting_pass}
      SERVICE_NAME: reporting-service
      DATABASE_URL: postgresql+asyncpg://reporting:${DB_REPORTING_PASSWORD:-reporting_pass}@db-reporting:5432/reporting_db
      RABBITMQ_URL: amqp://promptuario:${RABBITMQ_PASSWORD:-promptuario_pass}@rabbitmq:5672/
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-promptuario}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-promptuario_pass}
      S3_BUCKET_REPORTS: reports
      LOG_LEVEL: INFO
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-change-in-production-32chars}
      JWT_ALGORITHM: HS256
      IAM_DB_URL: postgresql://iam:iam_pass@db-iam:5432/iam_db
      PATIENT_DB_URL: postgresql://clinical:clinical_pass@db-patient-clinical:5432/patient_clinical_db
      CLINICAL_DB_URL: postgresql://clinical:clinical_pass@db-patient-clinical:5432/patient_clinical_db
    depends_on:
      db-reporting:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [ backend ]

  # Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬ API GATEWAY Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬
  gateway:
    build:
      context: ../backend-java/gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SERVER_PORT: 8000
      IAM_SERVICE_URL: http://iam-service:8000
      PATIENT_CLINICAL_SERVICE_URL: http://patient-clinical-service:8000
      AI_SERVICE_URL: http://ai-service:8000
      REPORTING_SERVICE_URL: http://reporting-service:8000
      RABBITMQ_MANAGEMENT_URL: "http://promptuario:${RABBITMQ_PASSWORD:-promptuario_pass}@rabbitmq:15672"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-change-in-production-32chars}
      FRONTEND_URL: "${FRONTEND_URL:-*}"
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      redis:
        condition: service_healthy
      iam-service:
        condition: service_healthy
      patient-clinical-service:
        condition: service_healthy
    networks:
      - backend

  # Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬ EXPORTERS Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬
  # RabbitMQ natively exposes Prometheus metrics on port 15692
  # (enabled via management plugin). Scraped directly in prometheus.yml.
  # No separate exporter image needed.
  #
  # Optional exporters (uncomment if you want DB metrics):
  # Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬ PROMETHEUS Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬
  # Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬ EMAIL SERVICE (MAILPIT) Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬
  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP Port
    networks: [ backend ]
    restart: unless-stopped

  # Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬ BACKUP SERVICE Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬
  backup-service:
    build:
      context: ../backend-java/backup-service
      dockerfile: Dockerfile
    container_name: backup-service
    restart: unless-stopped
    environment:
      - DB_IAM_PASS=${DB_IAM_PASSWORD:-iam_pass}
      - DB_PATIENT_CLINICAL_PASS=${DB_CLINICAL_PASSWORD:-clinical_pass}
      - DB_REPORTING_PASS=${DB_REPORTING_PASSWORD:-reporting_pass}
      - BACKUP_SCHEDULE_CRON=0 0 3 * * ?
      - BACKUP_RETENTION_DAYS=7
      - BACKUP_ENCRYPTION_ENABLED=true
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:-CHAVE_SECRETA_AES_256_PROMPTUARIO_32B}
      - DB_IAM_HOST=db-iam
      - DB_PATIENT_CLINICAL_HOST=db-patient-clinical
      - DB_REPORTING_HOST=db-reporting
      - MONGO_HOST=db-ai
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-promptuario}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-promptuario_pass}
      - MINIO_BACKUP_BUCKET=backups
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super-secret-change-in-production-32chars}
    volumes:
      - backup_data:/var/backups
    ports:
      - "8006:8000"
    depends_on:
      db-iam:
        condition: service_healthy
      db-patient-clinical:
        condition: service_healthy
      db-reporting:
        condition: service_healthy
      db-ai:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  iam_data:
  patient_clinical_data:
  reporting_data:
  ai_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  backup_data:
