global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # ─── Application Services ──────────────────────────────────────
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8000"]
    metrics_path: /metrics
  - job_name: iam-service
    static_configs:
      - targets: ["iam-service:8000"]
    metrics_path: /metrics
  - job_name: patient-clinical-service
    static_configs:
      - targets: ["patient-clinical-service:8000"]
    metrics_path: /metrics
  - job_name: ai-service
    static_configs:
      - targets: ["ai-service:8000"]
    metrics_path: /metrics
  - job_name: reporting-service
    static_configs:
      - targets: ["reporting-service:8000"]
    metrics_path: /metrics

  # ─── Backup / Disaster Recovery ────────────────────────────────
  # Expõe as métricas padronizadas do backup-service via Spring Boot Actuator
  # (backup_execution_duration_seconds, backup_status_total,
  #  backup_artifact_size_bytes, backup_last_success_timestamp_seconds,
  #  backup_retention_deleted_total, backup_restore_duration_seconds).
  - job_name: backup-service
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ["backup-service:8000"]

  # ─── RabbitMQ ─────────────────────────────────────────────────
  # RabbitMQ 3.13 management plugin exposes Prometheus metrics natively
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
    metrics_path: /metrics

  # ─── PostgreSQL ──────────────────────────────────────────────
  # Uncomment below when postgres-exporter is enabled in docker-compose.yml
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # ─── MongoDB ──────────────────────────────────────────────
  # Uncomment below when mongodb-exporter is enabled in docker-compose.yml
  - job_name: mongodb
    static_configs:
      - targets: ["mongodb-exporter:9216"]
    metrics_path: /metrics

  # ─── Node Exporter (Host Machine Metrics) ───────────────
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
