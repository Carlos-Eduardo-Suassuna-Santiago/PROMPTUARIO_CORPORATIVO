name: Docker Build & Publish

on:
  push:
    branches:
      - main
      - developer

jobs:
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - iam-service
          - patient-service
          - clinical-service
          - ai-service
          - reporting-service
          - gateway
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/promptuario-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/promptuario-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ secrets.PROD_API_URL }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/promptuario-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/promptuario-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
