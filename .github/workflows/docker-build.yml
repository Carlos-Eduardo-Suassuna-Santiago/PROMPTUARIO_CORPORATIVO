name: Docker Build & Publish

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
      - developer
    paths:
      - 'backend-java/**'
      - '.github/workflows/docker-build.yml'

jobs:
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - iam-service
          - patient-clinical-service
          - backup-service
          - gateway
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: backend-java/${{ matrix.service }}
          file: backend-java/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/promptuario-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/promptuario-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build-ai:
    name: Build and Push ai-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push AI service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend-java/ai-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/promptuario-ai-service:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/promptuario-ai-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build-reporting:
    name: Build and Push reporting-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push reporting service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend-java/reporting-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/promptuario-reporting-service:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/promptuario-reporting-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
