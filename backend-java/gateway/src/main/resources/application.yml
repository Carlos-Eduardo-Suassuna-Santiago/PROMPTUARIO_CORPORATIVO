server:
  port: 8000

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "${FRONTEND_URL:*}"
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
      routes:
        - id: iam-metrics
          uri: ${app.services.iam}
          predicates:
            - Path=/metrics
          filters:
            - name: CircuitBreaker
              args:
                name: iamCircuitBreaker
                fallbackUri: forward:/fallback/iam
                statusCodes: 500,502,503,504
        - id: iam-public
          uri: ${app.services.iam}
          predicates:
            - Path=/api/v1/auth/login,/api/v1/auth/refresh,/api/v1/auth/forgot-password,/api/v1/auth/reset-password,/api/v1/auth/register-patient,/api/v1/auth/oauth/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
            - name: CircuitBreaker
              args:
                name: iamCircuitBreaker
                fallbackUri: forward:/fallback/iam
                statusCodes: 500,502,503,504
        - id: iam-protected
          uri: ${app.services.iam}
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
            - name: CircuitBreaker
              args:
                name: iamCircuitBreaker
                fallbackUri: forward:/fallback/iam
                statusCodes: 500,502,503,504
        - id: patient-clinical
          uri: ${app.services.patient-clinical}
          predicates:
            - Path=/api/v1/patients/**,/api/v1/appointments/**,/api/v1/schedules/**,/api/v1/records/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
            - name: CircuitBreaker
              args:
                name: patientClinicalCircuitBreaker
                fallbackUri: forward:/fallback/patient-clinical
                statusCodes: 500,502,503,504
        - id: ai-debug-public
          uri: ${app.services.ai}
          predicates:
            - Path=/api/v1/ai/debug
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
            - name: CircuitBreaker
              args:
                name: aiCircuitBreaker
                fallbackUri: forward:/fallback/ai
                statusCodes: 500,502,503,504
        - id: ai-protected
          uri: ${app.services.ai}
          predicates:
            - Path=/api/v1/ai/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
            - name: CircuitBreaker
              args:
                name: aiCircuitBreaker
                fallbackUri: forward:/fallback/ai
                statusCodes: 500,502,503,504
        - id: reporting
          uri: ${app.services.reporting}
          predicates:
            - Path=/api/v1/reports/**,/api/v1/admin/**,/api/v1/audit/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
            - name: CircuitBreaker
              args:
                name: reportingCircuitBreaker
                fallbackUri: forward:/fallback/reporting
                statusCodes: 500,502,503,504
        - id: rabbitmq-ui
          uri: ${app.services.rabbitmq-management}
          predicates:
            - Path=/rabbitmq/**
          filters:
            - RewritePath=/rabbitmq/(?<segment>.*), /$\{segment}
            - RemoveRequestHeader=Authorization
            - name: CircuitBreaker
              args:
                name: rabbitmqCircuitBreaker
                fallbackUri: forward:/fallback/rabbitmq
                statusCodes: 500,502,503,504

management:
  endpoint:
    gateway:
      enabled: true
    prometheus:
      enabled: true
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include:
          - health
          - info
          - prometheus
          - gateway
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    org.springframework.cloud.gateway: ${GATEWAY_LOG_LEVEL:INFO}
    br.edu.ifrn.promptuario.gateway.fallback: ${GATEWAY_FALLBACK_LOG_LEVEL:INFO}

app:
  services:
    iam: ${IAM_SERVICE_URL:http://iam-service:8000}
    patient-clinical: ${PATIENT_CLINICAL_SERVICE_URL:http://patient-clinical-service:8000}
    ai: ${AI_SERVICE_URL:http://ai-service:8000}
    reporting: ${REPORTING_SERVICE_URL:http://reporting-service:8000}
    rabbitmq-management: ${RABBITMQ_MANAGEMENT_URL:http://guest:guest@rabbitmq:15672}
  security:
    jwt:
      secret: ${JWT_SECRET_KEY:change-me-in-production-super-secret-key-min-32-chars}
