groups:
  - name: promptuario
    rules:
      # ─── Availability ──────────────────────────────────────────
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Serviço {{ $labels.job }} está down"
          description: "O serviço {{ $labels.job }} está inacessível há mais de 1 minuto."

      - alert: PatientClinicalServiceDown
        expr: up{job="patient-clinical-service"} == 0 or absent(up{job="patient-clinical-service"})
        for: 1m
        labels:
          severity: critical
          service: patient-clinical-service
        annotations:
          summary: "Serviço unificado patient-clinical-service está down"
          description: "O serviço unificado patient-clinical-service está inacessível ou ausente do scrape há mais de 1 minuto."

      - alert: NoHeartbeat
        expr: time() - process_start_time_seconds{job=~".+"} > 300
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Serviço {{ $labels.job }} sem heartbeat"
          description: "O processo {{ $labels.job }} não reporta heartbeat há mais de 5 minutos."

      # ─── HTTP Errors ──────────────────────────────────────────
      - alert: HighErrorRate
        expr: |
          (
            sum by (service) (rate(http_requests_total{service=~"patient-clinical-service|patient-service|clinical-service",status_code=~"5.."}[5m]))
            /
            sum by (service) (rate(http_requests_total{service=~"patient-clinical-service|patient-service|clinical-service"}[5m]))
          ) > 0.05
          or
          (
            sum by (service) (rate(http_requests_total{status_code=~"5.."}[5m]))
            /
            sum by (service) (rate(http_requests_total[5m]))
          ) > 0.05
          or
          label_replace(
            (
              sum by (job) (rate(http_server_requests_seconds_count{job=~"patient-clinical-service|gateway|iam-service",status=~"5.."}[5m]))
              /
              sum by (job) (rate(http_server_requests_seconds_count{job=~"patient-clinical-service|gateway|iam-service"}[5m]))
            ) > 0.05,
            "service", "$1", "job", "(.+)"
          )
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Taxa de erro 5xx > 5% em {{ $labels.service }}"
          description: "O serviço {{ $labels.service }} está com {{ $value | humanizePercentage }} de erros 5xx nos últimos 5 minutos."

      - alert: High4xxRate
        expr: |
          (
            sum by (service) (rate(http_requests_4xx_total{service=~"patient-clinical-service|patient-service|clinical-service"}[5m]))
            /
            sum by (service) (rate(http_requests_total{service=~"patient-clinical-service|patient-service|clinical-service"}[5m]))
          ) > 0.10
          or
          (
            sum by (service) (rate(http_requests_4xx_total[5m]))
            /
            sum by (service) (rate(http_requests_total[5m]))
          ) > 0.10
          or
          label_replace(
            (
              sum by (job) (rate(http_server_requests_seconds_count{job=~"patient-clinical-service|gateway|iam-service",status=~"4.."}[5m]))
              /
              sum by (job) (rate(http_server_requests_seconds_count{job=~"patient-clinical-service|gateway|iam-service"}[5m]))
            ) > 0.10,
            "service", "$1", "job", "(.+)"
          )
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Taxa de erro 4xx > 10% em {{ $labels.service }}"
          description: "O serviço {{ $labels.service }} está com {{ $value | humanizePercentage }} de erros 4xx nos últimos 5 minutos."

      # ─── Latency ──────────────────────────────────────────────
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, sum by (le, service) (rate(http_request_duration_seconds_bucket{service=~"patient-clinical-service|patient-service|clinical-service"}[5m]))) > 2
          or
          histogram_quantile(0.95, sum by (le, service) (rate(http_request_duration_seconds_bucket[5m]))) > 2
          or
          label_replace(
            histogram_quantile(0.95, sum by (le, job) (rate(http_server_requests_seconds_bucket{job=~"patient-clinical-service|gateway|iam-service"}[5m]))) > 2,
            "service", "$1", "job", "(.+)"
          )
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P95 latência > 2s em {{ $labels.service }}"
          description: "A latência P95 do serviço {{ $labels.service }} está em {{ $value }}s."

      - alert: HighLatencyDegradation
        expr: |
          histogram_quantile(0.95, sum by (le, service) (rate(http_request_duration_seconds_bucket{service=~"patient-clinical-service|patient-service|clinical-service"}[5m]))) > 1.5
          or
          histogram_quantile(0.95, sum by (le, service) (rate(http_request_duration_seconds_bucket[5m]))) > 1.5
          or
          label_replace(
            histogram_quantile(0.95, sum by (le, job) (rate(http_server_requests_seconds_bucket{job=~"patient-clinical-service|gateway|iam-service"}[5m]))) > 1.5,
            "service", "$1", "job", "(.+)"
          )
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "P95 latência > 1.5s em {{ $labels.service }}"
          description: "A latência P95 do serviço {{ $labels.service }} está em {{ $value }}s por mais de 10 minutos."

      # ─── RabbitMQ ─────────────────────────────────────────────
      - alert: QueueDepthIncreasing
        expr: rabbitmq_queue_messages_ready > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Fila RabbitMQ com acúmulo > 1000 mensagens"
          description: "A fila {{ $labels.queue }} do RabbitMQ tem {{ $value }} mensagens prontas há mais de 5 minutos."

      - alert: QueueDepthCritical
        expr: rabbitmq_queue_messages_ready > 5000
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Fila RabbitMQ com acúmulo crítico > 5000 mensagens"
          description: "A fila {{ $labels.queue }} do RabbitMQ tem {{ $value }} mensagens prontas!"

      - alert: UnackedMessages
        expr: rabbitmq_queue_messages_unacked > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Mensagens não processadas > 500"
          description: "Há {{ $value }} mensagens não processadas na fila {{ $labels.queue }}."

      # ─── PostgreSQL ───────────────────────────────────────────
      - alert: PostgresConnectionsHigh
        expr: pg_stat_activity_count > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Conexões PostgreSQL altas > 50"
          description: "O banco {{ $labels.datname }} tem {{ $value }} conexões ativas."

      - alert: PostgresDeadlocks
        expr: rate(pg_stat_database_deadlocks[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Deadlocks detectados no PostgreSQL"
          description: "Deadlocks ocorrendo no banco {{ $labels.datname }}."

      # ─── MongoDB ──────────────────────────────────────────────
      - alert: MongoConnectionsHigh
        expr: mongodb_connections > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Conexões MongoDB altas > 100"
          description: "O MongoDB tem {{ $value }} conexões ativas."

      # ─── Business Metrics ─────────────────────────────────────
      - alert: LoginFailuresSpike
        expr: rate(login_attempts_total{status="failure"}[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pico de falhas de login > 10/min"
          description: "Taxa de {{ $value }} falhas de login/minuto — possível ataque de força bruta."

      - alert: LoginFailuresCritical
        expr: rate(login_attempts_total{status="failure"}[5m]) > 50
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Pico crítico de falhas de login > 50/min"
          description: "Taxa de {{ $value }} falhas de login/minuto — ataque de força bruta em andamento!"

      - alert: AiErrorsSpike
        expr: rate(ai_errors_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pico de erros na IA > 5/min"
          description: "O AI Service está com {{ $value }} erros/minuto."

      - alert: AiErrorsCritical
        expr: rate(ai_errors_total[5m]) > 20
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Pico crítico de erros na IA > 20/min"
          description: "O AI Service está com {{ $value }} erros/minuto — possível falha no LLM."

      - alert: AuditEventsFailing
        expr: |
          rate(audit_events_failed_total{service=~"patient-clinical-service|patient-service|clinical-service"}[5m]) > 0
          or
          rate(audit_events_failed_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Falhas ao registrar auditoria em {{ $labels.service }}"
          description: "O serviço {{ $labels.service }} está com falhas ao registrar eventos de auditoria."

      - alert: ReportsFailing
        expr: rate(reports_errors_total[5m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Erros na geração de relatórios > 3/min"
          description: "O Reporting Service está com {{ $value }} erros/min na geração de relatórios."

      - alert: CircuitBreakerOpen
        expr: |
          gateway_circuit_state > 0
          or
          label_replace(
            resilience4j_circuitbreaker_state{state="open"} == 1,
            "target", "$1", "name", "(.+)"
          )
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker aberto para {{ $labels.target }}"
          description: "O gateway abriu o circuit breaker para o serviço {{ $labels.target }}."

      - alert: HighRejectedRequests
        expr: |
          rate(http_requests_rejected_total{service=~"patient-clinical-service|patient-service|clinical-service"}[5m]) > 50
          or
          rate(http_requests_rejected_total[5m]) > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Muitas requisições rejeitadas > 50/min"
          description: "O serviço {{ $labels.service }} rejeitou {{ $value }} requisições/min (rate limit / auth)."

      - alert: PrescriptionGenerationFailing
        expr: |
          rate(reports_errors_total{report_type="PRESCRIPTIONS"}[5m]) > 2
          or
          rate(prescriptions_errors_total{service=~"patient-clinical-service|clinical-service"}[5m]) > 2
          or
          rate(prescription_pdf_generation_errors_total{service=~"patient-clinical-service|clinical-service"}[5m]) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Falhas na geração de prescrições"
          description: "Geração de prescrições com {{ $value }} erros/min."

      # ─── Backup / Disaster Recovery ────────────────────────────
      # Métricas expostas pelo backup-service em /actuator/prometheus.
      - alert: BackupJobFailed
        expr: increase(backup_status_total{status="failed"}[1h]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Execução de backup falhou em {{ $labels.target }}"
          description: "Houve {{ $value }} execução(ões) com falha para o alvo {{ $labels.target }} na última hora."

      - alert: BackupMissing24h
        expr: (time() - backup_last_success_timestamp_seconds) > 86400
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Violação de RPO em {{ $labels.target }} (sem backup há mais de 24h)"
          description: "O alvo {{ $labels.target }} está sem backup bem-sucedido há mais de 24 horas (RPO excedido)."

      - alert: BackupArtifactTooSmall
        expr: backup_artifact_size_bytes < 100000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Artefato de backup suspeito em {{ $labels.target }}"
          description: "O artefato de {{ $labels.target }} tem {{ $value }} bytes, abaixo do mínimo esperado de 100 KB — possível dump truncado ou corrompido."