server:
  port: 8000

spring:
  application:
    name: reporting-service
  datasource:
    url: "jdbc:postgresql://${DB_REPORTING_HOST:localhost}:5432/reporting_db"
    username: "${DB_REPORTING_USER:reporting}"
    password: "${DB_REPORTING_PASS:reporting_pass}"
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: "${RABBITMQ_HOST:localhost}"
    port: 5672

app:
  messaging:
    job-queue: reporting.job.queue
    domain-exchange: domain.events
  storage:
    s3:
      endpoint: "${S3_ENDPOINT:http://minio:9000}"
      access-key: "${S3_ACCESS_KEY:promptuario}"
      secret-key: "${S3_SECRET_KEY:promptuario_pass}"
      bucket-reports: "${S3_BUCKET_REPORTS:reports}"
      region: us-east-1
      presigned-url-expiration-minutes: 60
  security:
    jwt:
      secret: "${JWT_SECRET_KEY:change-me-in-production-super-secret-key-min-32-chars}"
      algorithm: HmacSHA256

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /docs