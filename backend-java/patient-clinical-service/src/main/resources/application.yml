server:
  port: ${SERVER_PORT:8000}

spring:
  application:
    name: patient-clinical-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/patient_clinical_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /docs

app:
  messaging:
    # Temporary bridge for the Python AI service during the migration.
    legacy-publish-enabled: ${APP_MESSAGING_LEGACY_PUBLISH_ENABLED:true}
  rabbitmq:
    exchanges:
      domain-events: domain.events
      iam-events: iam.events
    exchange-type: topic
  storage:
    s3:
      endpoint: "${S3_ENDPOINT:http://localhost:9000}"
      access-key: "${S3_ACCESS_KEY:minioadmin}"
      secret-key: "${S3_SECRET_KEY:minioadmin}"
      region: "${AWS_REGION:us-east-1}"
      bucket-patient-documents: "${S3_BUCKET_PATIENT_DOCUMENTS:patient-documents}"
      bucket-prescriptions: "${S3_BUCKET_PRESCRIPTIONS:prescriptions}"
  security:
    jwt:
      secret: "${JWT_SECRET_KEY:change-me-in-production-super-secret-key-min-32-chars}"
      algorithm: HMAC-SHA256
